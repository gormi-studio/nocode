  <!-- Undo the 404.html redirect trick (see public/404.html) before React
       Router ever reads the URL, on GitHub Pages only. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var redirect = q.get('redirect');
      if (redirect) {
        q.delete('redirect');
        var rest = q.toString();
        history.replaceState(null, '', '/nocode/' + redirect + (rest ? (redirect.includes('?') ? '&' : '?') + rest : ''));
      }
    })();
  </script>
