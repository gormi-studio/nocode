<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>고르미</title>
  <!--
    GitHub Pages serves this file for any unknown path, since it's a static
    host with no server-side rewrites for a client-side-routed SPA. Encode
    the requested path into a query string and redirect to the real
    index.html, which decodes it back before React Router ever sees it.
    Standard trick: https://github.com/rafgraph/spa-github-pages
  -->
  <script>
    var basePath = '/nocode/';
    var path = location.pathname.slice(basePath.length);
    var redirect = basePath + '?redirect=' + encodeURIComponent(path + location.search + location.hash);
    location.replace(redirect);
  </script>
</head>
<body></body>
</html>
